# Test servers: real Cobblemon on Fabric 1.21.1, Geyser standalone and ViaProxy. Data under $CLPOC_DATA
# (default ~/.cache/cl-fabric-poc), models from tools/build_models.py under $CLPOC_MODELS; ports on $CLPOC_BIND.
name: clpoc
networks:
  default:
    name: clpoc-net
services:
  fabric:
    image: itzg/minecraft-server:java21
    container_name: clpoc-fabric
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"   # PoC only: offline test clients
      MEMORY: 3G
      MODRINTH_PROJECTS: "fabric-api,fabric-language-kotlin,cobblemon:GJ2a1b8O"
      MODRINTH_ALLOWED_VERSION_TYPE: release
      MODE: creative
      LEVEL_TYPE: flat
      SPAWN_PROTECTION: 0
      ENABLE_RCON: "true"
      RCON_PASSWORD: poc-only
    volumes:
      - ${CLPOC_DATA:-${HOME}/.cache/cl-fabric-poc}/fabric:/data
      - ./mods-extra:/mods:ro
      - ${CLPOC_MODELS:-${HOME}/.cache/cl-fabric/modelpack}:/data/config/cobblemonlink/models:ro   # tools/build_models.py output
    ports:
      - "${CLPOC_BIND:-127.0.0.1}:25570:25565"
  # Bedrock path: phone (latest Bedrock) -> Geyser standalone (latest, speaks Java 26.3) -> ViaProxy (26.3 -> 1.21.1) -> fabric
  viaproxy:
    image: eclipse-temurin:25-jre
    container_name: clpoc-viaproxy
    user: "1000:1000"
    working_dir: /w
    command: ["java", "-jar", "ViaProxy.jar", "cli", "--target-address", "fabric:25565", "--target-version", "1.21.1", "--bind-address", "0.0.0.0:25568", "--auth-method", "NONE", "--rewrite-handshake-packet", "false"]  # keeps Floodgate's data in the handshake
    volumes:
      - ${CLPOC_DATA:-${HOME}/.cache/cl-fabric-poc}/viaproxy:/w
  geyser:
    image: eclipse-temurin:25-jre
    container_name: clpoc-geyser
    user: "1000:1000"
    working_dir: /w
    stdin_open: true
    command: ["java", "-jar", "Geyser-Standalone.jar", "--nogui"]
    volumes:
      - ${CLPOC_DATA:-${HOME}/.cache/cl-fabric-poc}/geyser:/w
    ports:
      - "${CLPOC_BIND:-127.0.0.1}:19140:19132/udp"
