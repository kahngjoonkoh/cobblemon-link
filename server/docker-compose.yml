# Paper 26.3 + cobblemon-link (gameplay) + BetterModel (Java models) + Geyser/GeyserModelEngine (Bedrock models)
# + a Pokémon Showdown sidecar for battles.
#   ./setup.sh && docker compose up -d --build     # first boot generates configs
#   docker compose down && ./setup.sh && docker compose up -d
# Then in game: /starter, and right-click (or tap) a wild Pokémon.
# Optional .env next to this file:
#   PACK_URL=https://your.host/build.zip   public URL of data/plugins/BetterModel/build.zip for Java players
#   PACK_BIND=0.0.0.0                       let the bundled pack server listen beyond localhost
#   MEMORY=3G
#   ONLINE_MODE=FALSE                       only for local bot testing; never on a reachable server

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: cobblemon-link-mc
    environment:
      EULA: "TRUE"               # you must accept the Minecraft EULA yourself before running
      TYPE: PAPER
      VERSION: "26.3"
      PAPER_BUILD: "190"
      MEMORY: ${MEMORY:-3G}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      LEVEL_TYPE: minecraft:normal   # spawns are per biome; a flat world is all plains
      DATAPACKS: /datapacks/cobblemon-link   # Cobblemon biome tags used by the spawn pools
      # BetterModel builds plugins/BetterModel/build.zip; Java clients download it from here.
      # The default only works for a client on this machine; real players need PACK_URL.
      RESOURCE_PACK: ${PACK_URL:-http://127.0.0.1:8099/build.zip}
      RESOURCE_PACK_ENFORCE: "TRUE"
    volumes:
      - ./data:/data
      - ../assets/datapack:/datapacks:ro
    depends_on: [sim]
    ports:
      - "127.0.0.1:25566:25565"     # Java
      - "19133:19132/udp"           # Bedrock (Geyser); 19133 so it can sit beside a normal server
    restart: unless-stopped
    # Safe shutdown: mc-server-runner stops Paper by typing "stop" on its console, which needs
    # stdin + tty. Without them the stop is never read and the server is SIGKILLed (corrupt worlds).
    stdin_open: true
    tty: true
    stop_grace_period: 2m          # > mc-server-runner's 60s stop window, so Docker never kills first

  pack:
    image: python:3.13-alpine
    container_name: cobblemon-link-pack
    working_dir: /pack
    command: ["python", "-m", "http.server", "8099"]
    volumes:
      - ./data/plugins/BetterModel:/pack:ro
    ports:
      - "${PACK_BIND:-127.0.0.1}:8099:8099"
    restart: unless-stopped

  sim:
    build: ../sim                  # Pokémon Showdown (MIT) battle engine; only the mc container talks to it
    container_name: cobblemon-link-sim
    restart: unless-stopped
