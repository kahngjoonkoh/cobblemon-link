# Prototype server: Paper 26.3 + BetterModel (Java models) + Geyser/GeyserModelEngine (Bedrock models).
#   ./setup.sh && docker compose up -d     # first boot generates configs
#   docker compose down && ./setup.sh && docker compose up -d
# Then in game (op): /bm spawn pikachu

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: cobblemon-link-mc
    environment:
      EULA: "TRUE"               # you must accept the Minecraft EULA yourself before running
      TYPE: PAPER
      VERSION: "26.3"
      PAPER_BUILD: "190"
      MEMORY: 3G
      ONLINE_MODE: "TRUE"        # bench/ used FALSE for a bot client; never expose an offline server
      LEVEL_TYPE: minecraft:flat
      # BetterModel builds plugins/BetterModel/build.zip; Java clients download it from here.
      # ponytail: localhost only works for a client on this machine; real players need a public URL.
      RESOURCE_PACK: "http://127.0.0.1:8099/build.zip"
      RESOURCE_PACK_ENFORCE: "TRUE"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:25566:25565"     # Java
      - "19133:19132/udp"           # Bedrock (Geyser); 19133 so it can sit beside a normal server
    restart: unless-stopped

  pack:
    image: python:3.13-alpine
    container_name: cobblemon-link-pack
    working_dir: /pack
    command: ["python", "-m", "http.server", "8099"]
    volumes:
      - ./data/plugins/BetterModel:/pack:ro
    ports:
      - "127.0.0.1:8099:8099"
    restart: unless-stopped
