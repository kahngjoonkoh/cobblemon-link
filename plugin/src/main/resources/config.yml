# Showdown battle sidecar (sim/ in the repo; the "sim" service in server/docker-compose.yml)
sim:
  host: sim
  port: 9000

spawning:                    # Cobblemon's defaults (CobblemonConfig, BestSpawnerConfig)
  interval-ticks: 20         # ticksBetweenSpawnAttempts: one pass per player per second
  zone-diameter: 8           # spawningZoneDiameter
  zone-height: 16            # spawningZoneHeight
  min-distance: 16           # minimumSpawningZoneDistanceFromPlayer
  max-distance: 64           # maximumSpawningZoneDistanceFromPlayer
  max-per-pass: 8            # maximumSpawnsPerPass
  per-chunk: 1               # pokemonPerChunk, over the 3x3 chunks around the zone
  entity-spacing: 8          # minimumDistanceBetweenEntities
  despawn-near: 32           # despawnerNearDistance: never despawns closer to a player
  despawn-far: 96            # despawnerFarDistance: always despawns further away (once old enough)
  despawn-min-age-ticks: 600
  despawn-max-age-ticks: 3600
  buckets:                   # worldBuckets
    common: 94.05
    uncommon: 5.0
    rare: 0.5
    ultra-rare: 0.2
    boss: 0.25

starter:
  level: 10                  # Cobblemon's starters are level 10
  balls: 0                   # Poké Balls given with the starter (Cobblemon gives none)
  random-pokemon: false      # true: the starter choice also offers one random wild Pokémon (rolled once per player)

pc:
  boxes: 40                  # boxes of 30 in each player's PC (Cobblemon's defaultBoxCount)

battle:
  max-distance: 24           # walking further away flees the battle
